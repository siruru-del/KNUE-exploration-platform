<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충북 지질 원격답사 플랫폼</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; overflow: hidden; background-color: #000; }
        #panorama { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        #menu-toggle-btn {
            position: absolute; top: 20px; left: 20px; z-index: 30;
            background-color: rgba(20, 20, 20, 0.85); color: #fff; padding: 12px 18px;
            border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s; backdrop-filter: blur(5px);
        }
        #menu-toggle-btn:hover { background-color: rgba(50, 50, 50, 0.9); transform: scale(1.05); }

        #sidebar {
            position: absolute; top: 70px; left: 20px; width: 260px;
            background-color: rgba(25, 25, 25, 0.85); color: white; border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 20; backdrop-filter: blur(5px);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease; transform-origin: top left;
        }
        #sidebar.collapsed { transform: translateX(-120%); opacity: 0; pointer-events: none; }
        #sidebar h2 { text-align: center; padding: 20px 15px 15px; margin: 0; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .menu-item { padding: 18px 20px; margin: 8px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 16px; font-weight: bold; }
        .menu-item:hover { background-color: rgba(255, 255, 255, 0.1); }
        .menu-item.active { background-color: #fff; color: #000; }
        .menu-item span { display: block; font-size: 12px; color: #aaa; margin-top: 6px; font-weight: normal; }
        .menu-item.active span { color: #555; }

        .pnlm-controls-container { top: auto !important; bottom: 20px !important; left: 20px !important; }
        
        /* -------------------------------------
           새로 추가된 커스텀 이동 마크 디자인
           ------------------------------------- */
        .custom-hotspot {
            width: 45px; height: 45px; border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4); /* 반투명 흰색 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: all 0.3s ease; backdrop-filter: blur(2px);
        }
        .custom-hotspot:hover { background-color: rgba(255, 255, 255, 0.9); transform: scale(1.15); }
        
        /* 마크 모양 (앞/뒤) */
        .hotspot-forward::after { content: "▲"; color: #2c3e50; }
        .hotspot-backward::after { content: "▼"; color: #2c3e50; }

        /* 커스텀 마크 툴팁 (마우스 올렸을 때 뜨는 글씨) 디자인 */
        .custom-hotspot .pnlm-tooltip {
            display: none; position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7); color: white; padding: 6px 12px;
            border-radius: 6px; font-size: 14px; white-space: nowrap; pointer-events: none;
        }
        .custom-hotspot:hover .pnlm-tooltip { display: block; }
        /* ------------------------------------- */

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
        }
        .modal-wrapper {
            display: flex; margin: auto; max-width: 80%; max-height: 80vh; position: relative; top: 50%; transform: translateY(-50%);
            background-color: #222; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); overflow: hidden;
        }
        .modal-content { max-width: 60%; object-fit: contain; background: #000; }
        .modal-text { width: 40%; padding: 30px; color: #fff; font-size: 16px; line-height: 1.6; overflow-y: auto; }
        .close { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 45px; font-weight: bold; cursor: pointer; z-index: 1001; }
        .close:hover { color: #aaa; }
    </style>
</head>
<body>

    <div id="menu-toggle-btn" onclick="toggleSidebar()">☰ 답사 지역 메뉴</div>

    <div id="sidebar" class="collapsed">
        <h2>🗺️ 어디로 이동할까요?</h2>
        <div class="menu-item active" onclick="changeScene('nongdari_0', this)">
            1. 진천 농다리
            <span>마우스로 드래그하여 주변 둘러보기</span>
        </div>
        <div class="menu-item" onclick="changeScene('chungseokgul_0', this)">
            2. 청주 청석굴
            <span>절벽의 습곡과 층리 관찰</span>
        </div>
    </div>

    <div id="panorama"></div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-wrapper">
            <img class="modal-content" id="modalImg">
            <div class="modal-text" id="modalDesc">여기에 설명이 표시됩니다.</div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
        }

        var modal = document.getElementById("imageModal");
        var modalImg = document.getElementById("modalImg");
        var modalDesc = document.getElementById("modalDesc");

        function showImagePopup(hotSpotDiv, args) {
            modal.style.display = "block";
            modalImg.src = args.img;
            modalDesc.innerHTML = args.desc;
        }

        function closeModal() {
            modal.style.display = "none";
        }

        /* 회전각 및 시야각 제한을 대폭 완화한 설정 */
        const commonViewSettings = {
            "haov": 240, "vaov": 90, 
            "minYaw": -120, "maxYaw": 120, 
            "minPitch": -40, "maxPitch": 40,
            "minHfov": 30, "maxHfov": 120, "hfov": 80
        };

        let viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "nongdari_0", 
                "sceneFadeDuration": 1000, 
                "autoLoad": true,
                "showZoomCtrl": true,
                "mouseZoom": true,
                "hotSpotDebug": true
            },
            "scenes": {
                /* ==========================================
                   1. 진천 농다리 동선 
                   ========================================== */
                "nongdari_0": Object.assign({
                    "type": "equirectangular",
                    "panorama": "nongdari/nongdari_background.jpg", 
                    "hotSpots": [
                        { "pitch": 5, "yaw": -10, "type": "info", "text": "농다리 상세 1", "clickHandlerFunc": showImagePopup, "clickHandlerArgs": { "img": "nongdari/nongdari_1.jpg", "desc": "<h3>농다리 1</h3><p>이곳에 지질학적 설명을 적어주세요.</p>" } },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "nongdari_1", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),
                
                "nongdari_1": Object.assign({
                    "type": "equirectangular",
                    "panorama": "nongdari/nongdari_background_1.jpg", 
                    "hotSpots": [
                        { "pitch": 5, "yaw": -10, "type": "info", "text": "농다리 상세 2", "clickHandlerFunc": showImagePopup, "clickHandlerArgs": { "img": "nongdari/nongdari_2.jpg", "desc": "<h3>농다리 2</h3><p>이곳에 지질학적 설명을 적어주세요.</p>" } },
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "nongdari_0", "cssClass": "custom-hotspot hotspot-backward" },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "nongdari_2", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "nongdari_2": Object.assign({
                    "type": "equirectangular",
                    "panorama": "nongdari/nongdari_background_2.jpg", 
                    "hotSpots": [
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "nongdari_1", "cssClass": "custom-hotspot hotspot-backward" },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "nongdari_3", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "nongdari_3": Object.assign({
                    "type": "equirectangular",
                    "panorama": "nongdari/nongdari_background_3.jpg", 
                    "hotSpots": [
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "nongdari_2", "cssClass": "custom-hotspot hotspot-backward" },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "nongdari_4", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "nongdari_4": Object.assign({
                    "type": "equirectangular",
                    "panorama": "nongdari/nongdari_background_4.jpg", 
                    "hotSpots": [
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "nongdari_3", "cssClass": "custom-hotspot hotspot-backward" }
                    ]
                }, commonViewSettings),

                /* ==========================================
                   2. 청주 청석굴 동선 
                   ========================================== */
                "chungseokgul_0": Object.assign({
                    "type": "equirectangular",
                    "panorama": "chungseokgul/chungseokgul_background.jpg", 
                    "hotSpots": [
                        { "pitch": 5, "yaw": -10, "type": "info", "text": "청석굴 암벽 1", "clickHandlerFunc": showImagePopup, "clickHandlerArgs": { "img": "chungseokgul/chungseokgul_1.jpg", "desc": "<h3>청석굴 노두</h3><p>이곳에 지질학적 설명을 적어주세요.</p>" } },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "chungseokgul_1", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "chungseokgul_1": Object.assign({
                    "type": "equirectangular",
                    "panorama": "chungseokgul/chungseokgul_background_1.jpg", 
                    "hotSpots": [
                        { "pitch": 5, "yaw": -10, "type": "info", "text": "청석굴 암벽 2", "clickHandlerFunc": showImagePopup, "clickHandlerArgs": { "img": "chungseokgul/chungseokgul_2.jpg", "desc": "<h3>청석굴 단면</h3><p>이곳에 지질학적 설명을 적어주세요.</p>" } },
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "chungseokgul_0", "cssClass": "custom-hotspot hotspot-backward" },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "chungseokgul_2", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "chungseokgul_2": Object.assign({
                    "type": "equirectangular",
                    "panorama": "chungseokgul/chungseokgul_background_2.jpg", 
                    "hotSpots": [
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "chungseokgul_1", "cssClass": "custom-hotspot hotspot-backward" },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "chungseokgul_3", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "chungseokgul_3": Object.assign({
                    "type": "equirectangular",
                    "panorama": "chungseokgul/chungseokgul_background_3.jpg", 
                    "hotSpots": [
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "chungseokgul_2", "cssClass": "custom-hotspot hotspot-backward" },
                        { "pitch": -15, "yaw": 15, "type": "scene", "text": "앞으로 이동", "sceneId": "chungseokgul_4", "cssClass": "custom-hotspot hotspot-forward" }
                    ]
                }, commonViewSettings),

                "chungseokgul_4": Object.assign({
                    "type": "equirectangular",
                    "panorama": "chungseokgul/chungseokgul_background_4.jpg", 
                    "hotSpots": [
                        { "pitch": -15, "yaw": -15, "type": "scene", "text": "뒤로 이동", "sceneId": "chungseokgul_3", "cssClass": "custom-hotspot hotspot-backward" }
                    ]
                }, commonViewSettings)
            }
        });

        function changeScene(sceneId, element) {
            viewer.loadScene(sceneId);
            let items = document.getElementsByClassName('menu-item');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
            element.classList.add('active');
        }
    </script>
</body>
</html>
