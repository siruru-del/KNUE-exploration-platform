
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충북 지질 원격답사 플랫폼</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: #000;
        }

        #panorama {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000;
        }

        /* 답사 지역 메뉴 */
        #menu-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 30;
            padding: 12px 18px;
            border: 0;
            border-radius: 25px;
            color: #fff;
            background: rgba(20, 20, 20, .86);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .4);
            backdrop-filter: blur(5px);
        }

        #menu-toggle-btn:hover { background: rgba(50, 50, 50, .95); }

        #sidebar {
            position: fixed;
            top: 70px;
            left: 20px;
            z-index: 30;
            width: 260px;
            color: #fff;
            background: rgba(25, 25, 25, .88);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .45);
            backdrop-filter: blur(6px);
            transition: transform .28s ease, opacity .24s ease;
            transform-origin: top left;
        }

        #sidebar.collapsed {
            transform: translateX(-120%);
            opacity: 0;
            pointer-events: none;
        }

        #sidebar h2 {
            margin: 0;
            padding: 20px 15px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            text-align: center;
            font-size: 18px;
        }

        .menu-item {
            margin: 8px;
            padding: 17px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color .18s ease, color .18s ease;
        }

        .menu-item:hover { background: rgba(255, 255, 255, .12); }
        .menu-item.active { color: #111; background: #fff; }
        .menu-item span {
            display: block;
            margin-top: 6px;
            color: #aaa;
            font-size: 12px;
            font-weight: normal;
        }
        .menu-item.active span { color: #555; }

        /*
          구글 스트리트 뷰처럼 화면 안의 일정한 위치에 머무는 이동 버튼.
          파노라마의 yaw / pitch 좌표를 사용하지 않으므로 사진을 돌려도 움직이지 않습니다.
        */
        #scene-navigation {
            position: fixed;
            top: 68%;
            left: 50%;
            z-index: 60;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .nav-hotspot {
            position: absolute;
            top: 0;
            width: 72px;
            height: 58px;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, .85);
            border-radius: 50%;
            color: #222;
            background: rgba(255, 255, 255, .78);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .42);
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%) perspective(350px) rotateX(48deg);
            transition: background-color .16s ease, box-shadow .16s ease, opacity .16s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-hotspot:hover:not(:disabled) {
            background: rgba(255, 255, 255, .98);
            box-shadow: 0 12px 25px rgba(0, 0, 0, .55);
        }

        .nav-hotspot:active:not(:disabled) {
            background: #fff;
        }

        .nav-hotspot:disabled {
            opacity: .22;
            cursor: default;
            box-shadow: none;
        }

        /* 앞으로 가기 버튼은 화면 중앙에, 뒤로 가기는 그 왼쪽에 둡니다. */
        #nav-prev { left: -91px; }
        #nav-next { left: 0; }

        #route-progress {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 60;
            min-width: 58px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 18px;
            color: #fff;
            background: rgba(20, 20, 20, .72);
            font-size: 13px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        /* Pannellum 기본 줌 / 전체 화면 컨트롤 */
        .pnlm-controls-container {
            top: auto !important;
            bottom: 20px !important;
            left: 20px !important;
        }

        /* 느린 통신 환경에서 현재 사진 로딩 상태를 표시합니다. */
        #load-status {
            display: none;
            position: fixed;
            z-index: 90;
            left: 50%;
            bottom: 12%;
            transform: translateX(-50%);
            max-width: min(92vw, 520px);
            padding: 11px 17px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 14px;
            background: rgba(20,20,20,.88);
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.35);
            backdrop-filter: blur(6px);
        }

        #load-status.visible {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #load-status.is-error {
            border-color: rgba(255,180,120,.7);
        }

        #retry-btn {
            display: none;
            flex-shrink: 0;
            background: #fff;
            border: 0;
            border-radius: 8px;
            padding: 8px 10px;
            color: #111;
            cursor: pointer;
            font-weight: bold;
        }

        #load-status.is-error #retry-btn {
            display: block;
        }

        /* 상세 사진 팝업 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .9);
            backdrop-filter: blur(5px);
        }

        .modal-wrapper {
            display: flex;
            position: relative;
            top: 50%;
            width: 90%;
            max-width: 1200px;
            height: 75vh;
            margin: auto;
            overflow: hidden;
            border-radius: 12px;
            background: #222;
            box-shadow: 0 5px 25px rgba(0, 0, 0, .5);
            transform: translateY(-50%);
        }

        .modal-content {
            width: 60%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .modal-text {
            width: 40%;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 25px;
            z-index: 1001;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover { color: #aaa; }

        @media (max-width: 600px) {
            #menu-toggle-btn {
                top: 12px;
                left: 12px;
                padding: 10px 14px;
                font-size: 14px;
            }

            #sidebar {
                top: 60px;
                left: 12px;
                width: min(260px, calc(100vw - 24px));
            }

            #scene-navigation { top: 68%; }

            .nav-hotspot {
                width: 64px;
                height: 52px;
                font-size: 27px;
            }

            #nav-prev { left: -78px; }
            #route-progress { right: 12px; bottom: 12px; }

            .pnlm-controls-container {
                bottom: 12px !important;
                left: 12px !important;
            }

            .modal-wrapper {
                flex-direction: column;
                width: 94%;
                height: 82vh;
            }

            .modal-content {
                width: 100%;
                height: 55%;
            }

            .modal-text {
                width: 100%;
                height: 45%;
                padding: 18px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <button id="menu-toggle-btn" type="button" onclick="toggleSidebar()">
        ☰ 답사 지역 메뉴
    </button>

    <div id="sidebar" class="collapsed">
        <h2>🗺️ 어디로 이동할까요?</h2>

        <div class="menu-item active"
             data-route="nongdari"
             onclick="changeScene('nongdari_0')">
            1. 진천 농다리
            <span>마우스로 드래그하여 주변 둘러보기</span>
        </div>

        <div class="menu-item"
             data-route="chungseokgul"
             onclick="changeScene('chungseokgul_0')">
            2. 청주 청석굴
            <span>절벽의 습곡과 층리 관찰</span>
        </div>
    </div>

    <div id="panorama"></div>

    <!-- 지도 중앙 부근에 고정되는 이동 버튼 -->
    <div id="scene-navigation" aria-label="답사 지점 이동">
        <button id="nav-prev"
                class="nav-hotspot"
                type="button"
                aria-label="이전 답사 지점"
                title="이전 지점"
                onclick="moveToScene(-1)">◀</button>

        <button id="nav-next"
                class="nav-hotspot"
                type="button"
                aria-label="다음 답사 지점"
                title="다음 지점"
                onclick="moveToScene(1)">▲</button>
    </div>

    <div id="route-progress">1 / 5</div>

    <div id="load-status" role="status" aria-live="polite">
        <span id="load-message">사진 불러오는 중...</span>
        <button id="retry-btn"
                type="button"
                onclick="window.location.reload()">
            새로고침 후 재시도
        </button>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-wrapper">
            <img class="modal-content"
                 id="modalImg"
                 alt="답사 지점 상세 사진">
            <div class="modal-text" id="modalDesc">
                여기에 설명이 표시됩니다.
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalDesc = document.getElementById('modalDesc');

        function showImagePopup(hotSpotDiv, args) {
            modal.style.display = 'block';
            modalImg.src = args.img;
            modalDesc.innerHTML = args.desc;
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        modal.addEventListener('click', event => {
            if (event.target === modal) closeModal();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeModal();
        });

        // 각 장소의 이동 순서
        const sceneRoutes = {
            nongdari: [
                'nongdari_0',
                'nongdari_1',
                'nongdari_2',
                'nongdari_3',
                'nongdari_4'
            ],
            chungseokgul: [
                'chungseokgul_0',
                'chungseokgul_1',
                'chungseokgul_2',
                'chungseokgul_3',
                'chungseokgul_4'
            ]
        };

        // 실제 사진 파일 경로와 기존 상세 정보는 유지합니다.
        // 길 안내용 버튼은 별도의 화면 고정 버튼으로 옮겼습니다.
        const sceneDefinitions = {
            nongdari_0: {
                panorama: 'nongdari/nongdari_background.jpg',
                hotSpots: [
                    {
                        pitch: 5,
                        yaw: -10,
                        type: 'info',
                        text: '농다리 상세 1',
                        clickHandlerFunc: showImagePopup,
                        clickHandlerArgs: {
                            img: 'nongdari/nongdari_1.jpg',
                            desc: '<h3>농다리 1</h3><p>이곳에 지질학적 설명을 적어주세요.</p>'
                        }
                    }
                ]
            },

            nongdari_1: {
                panorama: 'nongdari/nongdari_background_1.jpg',
                hotSpots: [
                    {
                        pitch: 5,
                        yaw: -10,
                        type: 'info',
                        text: '농다리 상세 2',
                        clickHandlerFunc: showImagePopup,
                        clickHandlerArgs: {
                            img: 'nongdari/nongdari_2.jpg',
                            desc: '<h3>농다리 2</h3><p>이곳에 지질학적 설명을 적어주세요.</p>'
                        }
                    }
                ]
            },

            nongdari_2: {
                panorama: 'nongdari/nongdari_background_2.jpg',
                hotSpots: []
            },

            nongdari_3: {
                panorama: 'nongdari/nongdari_background_3.jpg',
                hotSpots: []
            },

            nongdari_4: {
                panorama: 'nongdari/nongdari_background_4.jpg',
                hotSpots: []
            },

            chungseokgul_0: {
                panorama: 'chungseokgul/chungseokgul_background.jpg',
                hotSpots: [
                    {
                        pitch: 5,
                        yaw: -10,
                        type: 'info',
                        text: '청석굴 암벽 1',
                        clickHandlerFunc: showImagePopup,
                        clickHandlerArgs: {
                            img: 'chungseokgul/chungseokgul_1.jpg',
                            desc: '<h3>청석굴 노두</h3><p>이곳에 지질학적 설명을 적어주세요.</p>'
                        }
                    }
                ]
            },

            chungseokgul_1: {
                panorama: 'chungseokgul/chungseokgul_background_1.jpg',
                hotSpots: [
                    {
                        pitch: 5,
                        yaw: -10,
                        type: 'info',
                        text: '청석굴 암벽 2',
                        clickHandlerFunc: showImagePopup,
                        clickHandlerArgs: {
                            img: 'chungseokgul/chungseokgul_2.jpg',
                            desc: '<h3>청석굴 단면</h3><p>이곳에 지질학적 설명을 적어주세요.</p>'
                        }
                    }
                ]
            },

            chungseokgul_2: {
                panorama: 'chungseokgul/chungseokgul_background_2.jpg',
                hotSpots: []
            },

            chungseokgul_3: {
                panorama: 'chungseokgul/chungseokgul_background_3.jpg',
                hotSpots: []
            },

            chungseokgul_4: {
                panorama: 'chungseokgul/chungseokgul_background_4.jpg',
                hotSpots: []
            }
        };

        const panoramaElement = document.getElementById('panorama');
        const prevButton = document.getElementById('nav-prev');
        const nextButton = document.getElementById('nav-next');
        const routeProgress = document.getElementById('route-progress');
        const loadStatus = document.getElementById('load-status');
        const loadMessage = document.getElementById('load-message');

        function showLoading(message) {
            loadMessage.textContent = message;
            loadStatus.classList.add('visible');
            loadStatus.classList.remove('is-error');
        }

        function hideLoading() {
            loadStatus.classList.remove('visible', 'is-error');
        }

        function showLoadError(message) {
            loadMessage.textContent = message;
            loadStatus.classList.add('visible', 'is-error');
        }

        let viewer = null;
        let currentSceneId = 'nongdari_0';
        let navigationBusy = true;

        const addedScenes = new Set();
        const sceneConfigs = new Map();
        const scenePromises = new Map();

        // 세로 사진만 선명도가 떨어지지 않도록 시작할 때 넓게 보여줍니다.
        // 첫 번째 장면은 _0, 두 번째는 _1, 세 번째는 _2입니다.
        // 특히 농다리의 두 번째 장면과 _2 장면은 조금 더 넓은 시야각을 허용합니다.
        // 단, 사진 실제 범위 / 화면 비율이 허용하는 안전 범위가 항상 우선합니다.
        const PORTRAIT_MAX_HFOV = 56;

        const PORTRAIT_SCENE_MAX_HFOV = {
            nongdari_1: 65,
            nongdari_2: 65
        };

        function getRouteName(sceneId) {
            return sceneId.startsWith('nongdari_')
                ? 'nongdari'
                : 'chungseokgul';
        }

        function updateNavigation(sceneId = currentSceneId) {
            currentSceneId = sceneId;

            const routeName = getRouteName(sceneId);
            const route = sceneRoutes[routeName];
            const index = route.indexOf(sceneId);

            prevButton.disabled = navigationBusy || index <= 0;

            nextButton.disabled =
                navigationBusy ||
                index < 0 ||
                index >= route.length - 1;

            routeProgress.textContent =
                `${index + 1} / ${route.length}`;

            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.toggle(
                    'active',
                    item.dataset.route === routeName
                );
            });
        }

        // 파노라마 사진의 픽셀 크기를 읽습니다.
        function loadImageDimensions(src) {
            return new Promise((resolve, reject) => {
                const image = new Image();

                image.onload = () => resolve({
                    width: image.naturalWidth,
                    height: image.naturalHeight
                });

                image.onerror = () => reject(
                    new Error(`이미지를 불러오지 못했습니다: ${src}`)
                );

                image.src = src;
            });
        }

        /*
          [임시 추정] 이미지의 픽셀 비율로 haov / vaov를 계산합니다.
          실제 촬영 범위는 픽셀 크기만으로 알 수 없으므로
          원본 메타데이터나 촬영 화각으로 교정이 필요합니다.

          가로 사진은 넓은 수평 범위를,
          세로 사진은 넓은 수직 범위를 갖게 됩니다.

          세로 사진도 시작 시야각을 최대한 넓혀
          확대에 따른 픽셀 깨짐을 줄입니다.
        */
        function calculatePanoramaGeometry(width, height) {
            const MAX_HAOV = 240;
            const MAX_VAOV = 170;

            const ratio = width / height;

            // 가로·세로 각도 모두 한계를 넘지 않는 동일한 배율을 적용
            const scale = Math.min(
                MAX_HAOV / width,
                MAX_VAOV / height
            );

            const haov = width * scale;
            const vaov = height * scale;
            const isPortrait = ratio < 0.90;

            return {
                haov,
                vaov,
                ratio,
                isPortrait
            };
        }

        // 사진 범위와 현재 화면 비율을 바탕으로 검은 여백이 없는 한계를 계산합니다.
        // 세로 사진은 기본 56도, 농다리 2번째 / _2 장면은 65도까지 우선 허용하되
        // 실제 사진의 가로세로 각도보다 넓어질 수 없게 합니다.
        function getSafeViewBounds(geometry, sceneId) {
            const rect = panoramaElement.getBoundingClientRect();

            const viewportAspect = Math.max(
                0.25,
                rect.width / Math.max(1, rect.height)
            );

            // 세로 사진에서 화면 가장자리의 검은 여백이
            // 보이지 않도록 안전 구간을 확보합니다.
            const horizontalMargin = geometry.isPortrait ? 7 : 3;
            const verticalMargin = geometry.isPortrait ? 15 : 3;

            const safeHaov = Math.max(
                1,
                geometry.haov - horizontalMargin * 2
            );

            const safeVaov = Math.max(
                1,
                geometry.vaov - verticalMargin * 2
            );

            // 화면 비율에 따라 현재 사진에서 허용되는 최대 줌아웃 계산
            const maxFromVertical = 2 * Math.atan(
                Math.tan((safeVaov / 2) * Math.PI / 180)
                * viewportAspect
            ) * 180 / Math.PI;

            const portraitCap =
                PORTRAIT_SCENE_MAX_HFOV[sceneId]
                ?? PORTRAIT_MAX_HFOV;

            // 가로 사진은 이전 설정의 넓은 시야(최대 80도)를 유지합니다.
            // 세로 사진은 지정한 56도 / 65도 한도 안에서 계산합니다.
            const requestedMax = geometry.isPortrait
                ? portraitCap
                : 80;

            const maxHfov = Math.max(
                1,
                Math.min(
                    requestedMax,
                    safeHaov,
                    maxFromVertical
                )
            );

            const minHfov = Math.min(
                maxHfov,
                Math.max(1, maxHfov * 0.45)
            );

            // 최대 줌아웃 시 화면에 보이는 세로 화각
            const maxVisibleVerticalFov = 2 * Math.atan(
                Math.tan((maxHfov / 2) * Math.PI / 180)
                / viewportAspect
            ) * 180 / Math.PI;

            const yawLimit = Math.max(
                0,
                geometry.haov / 2 - horizontalMargin
            );

            const photoSafePitch = Math.max(
                0,
                (geometry.vaov - maxVisibleVerticalFov) / 2
                - verticalMargin
            );

            // 최대 줌아웃에서 화면의 위 / 아래 끝까지
            // 사진 안에 남도록 제한합니다.
            // 세로 사진은 상하 30도 상한을 추가로 적용합니다.
            const pitchLimit = geometry.isPortrait
                ? Math.min(30, photoSafePitch)
                : photoSafePitch;

            return {
                minHfov,
                maxHfov,
                minYaw: -yawLimit,
                maxYaw: yawLimit,
                minPitch: -pitchLimit,
                maxPitch: pitchLimit
            };
        }

        function createSceneConfig(sceneId, dimensions) {
            const definition = sceneDefinitions[sceneId];

            const geometry = calculatePanoramaGeometry(
                dimensions.width,
                dimensions.height
            );

            const viewBounds = getSafeViewBounds(
                geometry,
                sceneId
            );

            // 사진 유형별로 정해진 안전한 최대 줌아웃으로 처음 엽니다.
            // 세로 사진은 최대 56도(농다리 일부 65도),
            // 가로 사진은 최대 80도입니다.
            // 이보다 사진 범위가 좁으면 자동으로 줄어듭니다.
            const startHfov = viewBounds.maxHfov;

            const config = {
                type: 'equirectangular',
                panorama: definition.panorama,

                haov: geometry.haov,
                vaov: geometry.vaov,
                vOffset: 0,

                hfov: startHfov,
                minHfov: viewBounds.minHfov,
                maxHfov: viewBounds.maxHfov,

                minYaw: viewBounds.minYaw,
                maxYaw: viewBounds.maxYaw,

                minPitch: viewBounds.minPitch,
                maxPitch: viewBounds.maxPitch,

                pitch: 0,
                yaw: 0,

                // 사진 바깥 영역 노출 방지
                avoidShowingBackground: true,

                backgroundColor: [0, 0, 0],
                friction: 0.8,

                hotSpots: definition.hotSpots
            };

            sceneConfigs.set(sceneId, {
                config,
                geometry
            });

            return config;
        }

        async function buildSceneConfig(sceneId) {
            const definition = sceneDefinitions[sceneId];

            if (!definition) {
                throw new Error(
                    `등록되지 않은 장면입니다: ${sceneId}`
                );
            }

            const dimensions = await loadImageDimensions(
                definition.panorama
            );

            return createSceneConfig(sceneId, dimensions);
        }

        async function ensureSceneAdded(sceneId) {
            if (addedScenes.has(sceneId)) return;

            if (!viewer) {
                throw new Error(
                    '파노라마 뷰어가 아직 준비되지 않았습니다.'
                );
            }

            if (!scenePromises.has(sceneId)) {
                const promise = buildSceneConfig(sceneId)
                    .then(config => {
                        viewer.addScene(sceneId, config);
                        addedScenes.add(sceneId);
                    })
                    .finally(() => {
                        scenePromises.delete(sceneId);
                    });

                scenePromises.set(sceneId, promise);
            }

            await scenePromises.get(sceneId);
        }

        function moveToScene(direction) {
            if (!viewer || navigationBusy) return;

            const route = sceneRoutes[
                getRouteName(currentSceneId)
            ];

            const currentIndex = route.indexOf(currentSceneId);
            const targetIndex = currentIndex + direction;

            if (
                targetIndex < 0 ||
                targetIndex >= route.length
            ) {
                return;
            }

            navigateToScene(route[targetIndex]);
        }

        async function changeScene(sceneId) {
            if (!viewer || navigationBusy) return;

            await navigateToScene(sceneId);

            document.getElementById('sidebar')
                .classList.add('collapsed');
        }

        async function navigateToScene(sceneId) {
            if (
                !viewer ||
                navigationBusy ||
                sceneId === currentSceneId
            ) {
                return;
            }

            navigationBusy = true;
            updateNavigation(currentSceneId);

            showLoading(
                "선택한 답사 사진을 불러오는 중입니다..."
            );

            try {
                await ensureSceneAdded(sceneId);

                // 이전 장면의 줌 값을 넘겨받지 않습니다.
                // 장면을 다시 열 때마다 안전한 최대 줌아웃 계산
                const saved = sceneConfigs.get(sceneId);

                const targetHfov = getSafeViewBounds(
                    saved.geometry,
                    sceneId
                ).maxHfov;

                // 새 장면, 상하 중심, 좌우 중심, 최대 줌아웃
                viewer.loadScene(
                    sceneId,
                    0,
                    0,
                    targetHfov
                );

                // scenechange 이벤트에서 현재 지점 갱신
            } catch (error) {
                console.error(error);

                navigationBusy = false;
                updateNavigation(currentSceneId);

                showLoadError(
                    "사진을 불러오지 못했습니다. 인터넷 연결과 사진 파일 경로를 확인해 주세요."
                );
            }
        }

        // 장면을 처음 열거나 다른 곳에서 돌아왔을 때 시점 초기화
        // 같은 장면을 드래그하거나 확대하는 동안에는 사용자 조작 유지
        function resetSceneView(sceneId) {
            if (!viewer) return;

            const saved = sceneConfigs.get(sceneId);
            if (!saved) return;

            const bounds = getSafeViewBounds(
                saved.geometry,
                sceneId
            );

            viewer.setPitch(0, false);
            viewer.setYaw(0, false);
            viewer.setHfov(bounds.maxHfov, false);
        }

        // 창 크기 / 모바일 화면 회전이 바뀌면 줌아웃 상한 재계산
        function refreshZoomLimit() {
            if (!viewer) return;

            const saved = sceneConfigs.get(currentSceneId);
            if (!saved) return;

            viewer.resize();

            const bounds = getSafeViewBounds(
                saved.geometry,
                currentSceneId
            );

            // 화면 크기에 맞춰 이동 범위와 줌아웃 한계 재적용
            viewer.setHfovBounds([
                bounds.minHfov,
                bounds.maxHfov
            ]);

            viewer.setYawBounds([
                bounds.minYaw,
                bounds.maxYaw
            ]);

            viewer.setPitchBounds([
                bounds.minPitch,
                bounds.maxPitch
            ]);

            if (viewer.getHfov() > bounds.maxHfov) {
                viewer.setHfov(
                    bounds.maxHfov,
                    false
                );
            }

            // 창 크기 변경 시 상하 방향 보정
            const safePitch = Math.max(
                bounds.minPitch,
                Math.min(
                    bounds.maxPitch,
                    viewer.getPitch()
                )
            );

            if (
                Math.abs(safePitch - viewer.getPitch()) > 0.01
            ) {
                viewer.setPitch(
                    safePitch,
                    false
                );
            }

            // 창 크기 변경 시 좌우 방향 보정
            const safeYaw = Math.max(
                bounds.minYaw,
                Math.min(
                    bounds.maxYaw,
                    viewer.getYaw()
                )
            );

            if (
                Math.abs(safeYaw - viewer.getYaw()) > 0.01
            ) {
                viewer.setYaw(
                    safeYaw,
                    false
                );
            }
        }

        async function initializePanorama() {
            showLoading(
                "첫 번째 답사 사진을 불러오는 중입니다..."
            );

            const firstConfig = await buildSceneConfig(
                'nongdari_0'
            );

            viewer = pannellum.viewer('panorama', {
                default: {
                    firstScene: 'nongdari_0',
                    sceneFadeDuration: 650,
                    autoLoad: true,
                    showZoomCtrl: true,
                    mouseZoom: true,
                    draggable: true,
                    friction: 0.8
                },

                scenes: {
                    nongdari_0: firstConfig
                }
            });

            addedScenes.add('nongdari_0');

            viewer.on('scenechange', sceneId => {
                currentSceneId = sceneId;

                updateNavigation(sceneId);

                showLoading(
                    "현재 답사 사진을 불러오는 중입니다..."
                );
            });

            viewer.on('load', () => {
                navigationBusy = false;

                updateNavigation(currentSceneId);
                refreshZoomLimit();

                // 최초 화면, 다음/이전 이동, 재방문 모두 최대 줌아웃
                resetSceneView(currentSceneId);

                hideLoading();
            });

            viewer.on('error', message => {
                console.error(
                    'Pannellum 오류:',
                    message
                );

                navigationBusy = false;
                updateNavigation(currentSceneId);

                showLoadError(
                    "사진 표시 중 오류가 발생했습니다. 인터넷 연결이나 파일 경로를 확인해 주세요."
                );
            });

            updateNavigation('nongdari_0');

            window.addEventListener(
                'resize',
                refreshZoomLimit
            );

            viewer.on(
                'fullscreenchange',
                refreshZoomLimit
            );
        }

        initializePanorama().catch(error => {
            console.error(
                '파노라마 초기화 실패:',
                error
            );

            navigationBusy = false;
            updateNavigation(currentSceneId);

            showLoadError(
                '첫 번째 사진을 불러오지 못했습니다. 인터넷 연결과 사진 폴더를 확인해 주세요.'
            );
        });
    </script>
</body>
