<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충북 지질 원격답사 플랫폼</title>
    
    <!-- 360도 파노라마 구현을 위한 Pannellum 라이브러리 불러오기 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        /* 전체 화면 꽉 차게 설정 */
        body { margin: 0; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; display: flex; height: 100vh; overflow: hidden; background-color: #f4f4f9; }
        
        /* 왼쪽 사이드바(메뉴) 디자인 */
        #sidebar {
            width: 260px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #sidebar h2 {
            text-align: center;
            padding: 25px 15px;
            margin: 0;
            background-color: #1a252f;
            font-size: 20px;
            border-bottom: 2px solid #e74c3c;
        }
        .menu-item {
            padding: 20px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: all 0.3s ease;
            font-size: 17px;
            font-weight: bold;
        }
        /* 사이드바 메뉴에 마우스를 올리거나 현재 선택된 지역일 때의 색상 */
        .menu-item:hover, .menu-item.active {
            background-color: #3498db;
            padding-left: 25px; /* 살짝 오른쪽으로 밀리는 효과 */
        }
        .menu-item span {
            display: block;
            font-size: 13px;
            color: #ecf0f1;
            margin-top: 8px;
            font-weight: normal;
        }

        /* 오른쪽 360도 파노라마 메인 화면 영역 */
        #main-content {
            flex-grow: 1;
            position: relative;
        }
        #panorama { width: 100%; height: 100%; }

        /* 사진 확대 팝업(모달) 디자인 */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.85); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90vh;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover { color: #e74c3c; }
    </style>
</head>
<body>

    <!-- 왼쪽 사이드바 영역 -->
    <div id="sidebar">
        <h2>🗺️ 답사 지역 선택</h2>
        
        <!-- 첫 번째 메뉴: 진천 농다리 (기본 선택 상태로 active 클래스 추가) -->
        <div class="menu-item active" onclick="changeScene('nongdari', this)">
            1. 진천 농다리
            <span>마우스로 드래그하여 주변 둘러보기</span>
        </div>
        
        <!-- 두 번째 메뉴: 청석굴 -->
        <div class="menu-item" onclick="changeScene('chungseokgul', this)">
            2. 청주 청석굴
            <span>절벽의 습곡과 층리 관찰</span>
        </div>
    </div>

    <!-- 오른쪽 메인 파노라마 뷰어 영역 -->
    <div id="main-content">
        <div id="panorama"></div>
    </div>

    <!-- 사진 확대 팝업(모달) 창 -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        // --- 1. 사진 클릭 시 팝업 띄우는 기능 ---
        var modal = document.getElementById("imageModal");
        var modalImg = document.getElementById("modalImg");

        function showImagePopup(hotSpotDiv, imageSrc) {
            modal.style.display = "block";
            modalImg.src = imageSrc;
        }

        function closeModal() {
            modal.style.display = "none";
        }

        // --- 2. Pannellum 360도 파노라마 뷰어 설정 ---
        let viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "nongdari", // 처음에 띄울 장소
                "sceneFadeDuration": 1000, // 장소 넘어갈 때 화면 부드럽게 전환 (1초)
                "autoLoad": true,
                "showZoomCtrl": true,
                "mouseZoom": true
            },
            "scenes": {
                // ---- 진천 농다리 설정 ----
                "nongdari": {
                    "type": "equirectangular",
                    "panorama": "nongdari_background.jpg",
                    
                    /* 좌우 회전 범위 및 왜곡 방지 (보내주신 예전 코드 설정 적용[cite: 15]) */
                    "haov": 240,       
                    "vaov": 70,        
                    "minYaw": -120, "maxYaw": 120,     
                    "minPitch": -30, "maxPitch": 30,    
                    "minHfov": 30, "maxHfov": 100, "hfov": 80,       
                    "pitch": 0, "yaw": 0,
                    
                    /* 핫스팟(i 아이콘) 설정 및 클릭 시 확대 사진 연결 */
                    "hotSpots": [
                        {
                            "pitch": 5, "yaw": -30,  // 아이콘 위치 (상하, 좌우 각도)
                            "type": "info", 
                            "text": "왼쪽 암벽 상세 보기 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "nongdari_1.jpg" // 띄울 사진
                        },
                        {
                            "pitch": 5, "yaw": 0, 
                            "type": "info", 
                            "text": "중앙 암벽 상세 보기 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "nongdari_2.jpg"
                        },
                        {
                            "pitch": 5, "yaw": 30, 
                            "type": "info", 
                            "text": "오른쪽 암벽 상세 보기 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "nongdari_3.jpg"
                        }
                    ]
                },
                // ---- 청주 청석굴 설정 ----
                "chungseokgul": {
                    "type": "equirectangular",
                    "panorama": "chungseokgul_background.jpg",
                    
                    "haov": 240,
                    "vaov": 70,
                    "minYaw": -120, "maxYaw": 120,
                    "minPitch": -30, "maxPitch": 30,
                    "minHfov": 30, "maxHfov": 100, "hfov": 80,
                    "pitch": 0, "yaw": 0,

                    "hotSpots": [
                        {
                            "pitch": 5, "yaw": -45, 
                            "type": "info", 
                            "text": "청석굴 암벽 1 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "chungseokgul_1.jpg"
                        },
                        {
                            "pitch": 10, "yaw": -25, 
                            "type": "info", 
                            "text": "청석굴 암벽 2 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "chungseokgul_2.jpg"
                        },
                        {
                            "pitch": 15, "yaw": 0, 
                            "type": "info", 
                            "text": "청석굴 암벽 3 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "chungseokgul_3.jpg"
                        },
                        {
                            "pitch": 20, "yaw": 25, 
                            "type": "info", 
                            "text": "청석굴 암벽 4 (클릭)",
                            "clickHandlerFunc": showImagePopup,
                            "clickHandlerArgs": "chungseokgul_4.jpg"
                        }
                    ]
                }
            }
        });

        // --- 3. 왼쪽 사이드바 클릭 시 장소 변경하는 기능 ---
        function changeScene(sceneId, element) {
            // 파노라마 화면 다른 장소로 교체
            viewer.loadScene(sceneId);
            
            // 모든 메뉴에서 파란색 배경 지우고, 클릭한 메뉴만 파란색으로 칠하기
            let items = document.getElementsByClassName('menu-item');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
            element.classList.add('active');
        }
    </script>
</body>
</html>
